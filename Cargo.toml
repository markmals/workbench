[package]
name = "workbench"
version = "2.0.0"
edition = "2024"
rust-version = "1.100"
description = "The Workbench development process: its CLI and the plugin content harnesses load"
repository = "https://github.com/markmals/workbench"
publish = false

[dependencies]
clap = { version = "4.6", features = ["string", "wrap_help"] }
clap_complete = "4.6"
regex = "1.13"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
toml_edit = "0.25"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
