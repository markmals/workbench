# Knope owns Workbench's versions, changelog, and releases. Change files in `.changeset/` are the
# only source of version bumps: Scoped Commits subjects are not Conventional Commits.

[package]
versioned_files = [
    "Cargo.toml",
    "Cargo.lock",
    # Claude Code reads the plugin's version from its manifest, which ships in every archive.
    { path = "plugin/.claude-plugin/plugin.json", regex = '"version": "(?<version>[^"]+)"' },
]
changelog = "CHANGELOG.md"

[[package.assets]]
path = "artifacts/workbench-aarch64-apple-darwin.tar.gz"

[[package.assets]]
path = "artifacts/workbench-x86_64-apple-darwin.tar.gz"

[[package.assets]]
path = "artifacts/workbench-aarch64-unknown-linux-musl.tar.gz"

[[package.assets]]
path = "artifacts/workbench-x86_64-unknown-linux-musl.tar.gz"

[changes]
ignore_conventional_commits = true

[release_notes]
change_templates = [
    "### $summary\n\n$details",
    "* $summary by @$pr_author_login in #$pr_number",
    "* $summary",
]

[github]
owner = "markmals"
repo = "workbench"

# `.github/workflows/prepare-release.yml` runs this on every push to `main`: it keeps one release
# pull request open from the `release` branch, showing the next version and its changelog entry.
[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -c release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"release: prepare $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "release: prepare $version"

[workflows.steps.body]
template = "Merging this pull request releases Workbench $version: it builds the four archives, tags `v$version`, and publishes the GitHub release with these notes.\n\n$changelog"

# `.github/workflows/release.yml` runs this when the release pull request merges, after it has
# built the archives into `artifacts/`.
[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"
