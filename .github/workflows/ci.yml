name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    # `mise run check` is the one definition of the blocking gate, and this job is the
    # only place it runs automatically: no git hook runs it. Agents wait for this job
    # to pass before marking a pull request ready or merging it.
    check:
        name: Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - run: mise run link
            - run: mise run check

    commits:
        name: Commit messages
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - run: mise run build
            - name: Check every commit subject in the pull request
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: mise exec -- workbench commits check --output text "$BASE_SHA" "$HEAD_SHA"

    # Knope's release pull request consumes change files instead of adding one, so it is exempt.
    change-files:
        name: Change files
        if: github.event_name == 'pull_request' && github.head_ref != 'release'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: jdx/mise-action@v5
            - run: mise run build
            - name: Require a change file or a Release-Note trailer
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: mise exec -- workbench change-files check --output text "$BASE_SHA" "$HEAD_SHA"
