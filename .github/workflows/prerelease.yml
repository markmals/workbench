# Publishes a prerelease of the package from any branch, for previewing a change in real
# projects: `3.0.0-rc.1` is installed with `mise use github:markmals/workbench@3.0.0-rc.1`.
# The repository is public, so a prerelease is public too; publishing one needs the owner's
# explicit confirmation. Delete the prerelease and its tag once the preview is done.

name: Prerelease

on:
    workflow_dispatch:
        inputs:
            version:
                description: The prerelease version, such as 3.0.0-rc.1
                type: string
                required: true

permissions:
    contents: read

concurrency:
    group: prerelease-${{ inputs.version }}
    cancel-in-progress: false

jobs:
    validate:
        name: Validate the version
        runs-on: ubuntu-latest
        steps:
            - name: Require a prerelease version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
                      echo "::error::$VERSION is not a prerelease version such as 3.0.0-rc.1"
                      exit 1
                  fi

    build:
        needs: validate
        uses: ./.github/workflows/build-archives.yml
        with:
            version: ${{ inputs.version }}
        permissions:
            contents: read
            id-token: write
            attestations: write

    publish:
        name: Publish the prerelease
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: workbench-*
                  merge-multiple: true
            - name: Create the prerelease
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  VERSION: ${{ inputs.version }}
                  TARGET: ${{ github.sha }}
              run: |
                  gh release create "v$VERSION" artifacts/*.tar.gz \
                      --repo "${{ github.repository }}" \
                      --target "$TARGET" \
                      --prerelease \
                      --title "v$VERSION" \
                      --notes "Prerelease of Workbench $VERSION from ${{ github.ref_name }} at $TARGET, for preview only."
