# Merging Knope's release pull request is the explicit release authorization the process
# requires. This workflow builds the four archives, attests them, and runs `knope release`, which
# tags `v<version>` and publishes the GitHub release with the changelog entry as its notes.

name: Release

on:
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    build:
        if: github.head_ref == 'release' && github.event.pull_request.merged == true
        uses: ./.github/workflows/build-archives.yml
        permissions:
            contents: read
            id-token: write
            attestations: write

    release:
        name: Publish the GitHub release
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: workbench-*
                  merge-multiple: true
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise exec -- knope release --verbose
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
