# Workbench's documentation site: the records rendered in place by the Workbench theme.
#
# Build with `mise run docs:build` (Hugo, then Pagefind) into docs/public, or serve with
# `mise run docs:dev`. A deployed build sets its base URL through HUGO_BASEURL, which Hugo
# reads in place of `baseURL` below, so a preview can be served from any path.

baseURL = "http://localhost:1313/"
title = "Workbench"
themesDir = "../.workbench"
theme = "site"
disableKinds = ["taxonomy", "term", "rss", "sitemap"]

[params]
description = "A platform-agnostic, harness-agnostic agentic development process kit."
tagline = "A platform-agnostic, harness-agnostic agentic development process kit. Current specifications state the contract; proposals explain changes to it. Tests verify behavior, guides explain its use, code implements it, and previews and independent review expose disagreement."
# Links to repository files the site does not publish resolve to `<repository>/blob/main/<path>`.
repository = "https://github.com/markmals/workbench"
logo = "workbench-icon.png"
favicon = "favicon.svg"
heroImage = "workbench-hero.png"

[menus]
[[menus.main]]
name = "Vision"
pageRef = "/vision"
weight = 10
[[menus.main]]
name = "Process"
pageRef = "/process"
weight = 20
[[menus.main]]
name = "Guides"
pageRef = "/guides"
weight = 30
[[menus.main]]
name = "Change history"
pageRef = "/proposals"
weight = 40
[[menus.main]]
name = "Policies"
pageRef = "/policies"
weight = 50
[[menus.main]]
name = "Decisions"
pageRef = "/decisions"
weight = 60

# The CLI reference is generated from the command registry; this titles its page in the guides
# unless the file sets a title of its own.
[[cascade]]
title = "CLI Reference"
[cascade.target]
path = "/guides/cli-reference"

# The records are published from where they live; nothing is copied into docs/. Each
# directory's README is that section's index page.
[module]
[[module.mounts]]
source = "../VISION.md"
target = "content/VISION.md"
[[module.mounts]]
source = "../PROCESS.md"
target = "content/PROCESS.md"
[[module.mounts]]
source = "../guides"
target = "content/guides"
files = ["! README.md"]
[[module.mounts]]
source = "../guides/README.md"
target = "content/guides/_index.md"
[[module.mounts]]
source = "../plugin/reference/cli.md"
target = "content/guides/cli-reference.md"
[[module.mounts]]
source = "../proposals"
target = "content/proposals"
files = ["! README.md"]
[[module.mounts]]
source = "../proposals/README.md"
target = "content/proposals/_index.md"
[[module.mounts]]
source = "../policies"
target = "content/policies"
files = ["! README.md"]
[[module.mounts]]
source = "../policies/README.md"
target = "content/policies/_index.md"
[[module.mounts]]
source = "../decisions"
target = "content/decisions"
files = ["! README.md"]
[[module.mounts]]
source = "../decisions/README.md"
target = "content/decisions/_index.md"
# The theme checks that a link to an unpublished file names a file in the repository. The
# repository is only looked up, never published.
[[module.mounts]]
source = ".."
target = "assets/repository"
files = ["! .git/**", "! target/**", "! node_modules/**", "! docs/public/**", "! docs/resources/**"]
