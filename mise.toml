#:schema https://mise.jdx.dev/schema/mise.json
# mise owns the task graph. Every other tool is invoked from a task here, so the
# local gate and the CI gate cannot drift apart.
min_version = "2026.11.8"

[settings]
# Keep mise.lock current as tools change; `mise lock --platform …` regenerates it.
lockfile = true

[tools]
# hk's `cargo_fmt` and `cargo_clippy` steps need both components on every machine, CI included.
rust = { version = "1.100.0", components = "rustfmt,clippy" }
# hk's version must match the `amends`/`import` URLs in hk.pkl — bump both together.
hk = "2.8.1"
gh = "2.103.2"
actionlint = "1.7.12"
dprint = "0.64.3"
worktrunk = "0.81.0" # provides `wt`
# Beads is not in the mise registry; the GitHub release backend installs the same
# binary `brew install beads` does. Pin it: an older `bd` refuses to open a newer DB.
"github:gastownhall/beads" = "1.3.2" # provides `bd`
"github:knope-dev/knope" = { version = "0.24.0", version_prefix = "knope/v" }
hugo = "0.170.0"
"github:CloudCannon/pagefind" = "1.6.0"

[env]
# In mise contexts `workbench` is this working tree's build, so the tasks and git hooks run the
# CLI under development. A consumer project gets the pinned release here instead.
_.path = ["{{config_root}}/target/debug"]

# ── The task interface every Workbench project implements ────────────────────

[tasks.setup]
description = "Idempotent first-run bootstrap: the package link, the CLI, this machine's Beads replica, git hooks"
depends = ["link"]
run = [
    "cargo build",
    # A project that already has a Beads workspace restores this machine's replica from the
    # remote's `refs/dolt/data` (`bd bootstrap` never replaces a replica that exists); only a
    # project without one creates it. `bd init` here would start an unrelated history.
    # `--skip-agents` stops bd from writing its own agent-instruction files.
    # `--skip-hooks` is load-bearing: without it `bd init` points core.hooksPath at
    # .beads/hooks, and every hook hk installs is then ignored by git.
    "if [ -f .beads/config.yaml ]; then bd bootstrap --yes; else bd init --non-interactive --prefix workbench --skip-agents --skip-hooks; fi",
    # Commit `.beads/issues.jsonl` so the work graph is reviewable in a diff.
    "bd config set export.auto true",
    # Syncs happen at the process's sync points (`mise run beads:sync`). Auto-push would push
    # on every write and race other machines' pushes.
    "bd config set dolt.auto-push false",
    # hk owns every git hook (see hk.pkl). Never run `bd hooks install`.
    "hk install --mise",
]

[tasks.link]
description = "Link .workbench to this working tree's plugin/, as a consumer's `mise install` links the pinned release"
run = "ln -sfn plugin .workbench"

[tasks.check]
description = "The single blocking gate: formatting, lint, tests, records, the site"
alias = "c"
# `hk check --all` runs every step in hk.pkl: whitespace, newlines, merge conflicts,
# actionlint, dprint, rustfmt, and Clippy.
depends = ["test"]
run = ["hk check --all", "mise run validate", "mise run docs:build"]

[tasks.fmt]
alias = "f"
description = "Format in place with hk's fixers (dprint, rustfmt); accepts file paths, all files when none"
usage = 'arg "[files]" help="Files to format" var=#true'
run = "hk fix ${usage_files:---all}"

# ── Workbench's own operations, for humans and git hooks ─────────────────────

[tasks.status]
description = "Where the work stands: current phase, next action, who acts, and Beads"
depends = ["build"]
run = "workbench workflow status --output text"

[tasks.validate]
description = "Check the records and this project's use of Workbench"
depends = ["build", "link"]
run = ["workbench records validate --output text", "workbench project validate --output text"]

[tasks."beads:sync"]
description = "Sync this machine's Beads replica with the project's remote"
depends = ["build"]
run = "workbench beads sync --output text"

[tasks."beads:claim"]
description = "Claim a Beads item as this machine and confirm the claim survived a sync: `mise run beads:claim -- <id>`"
depends = ["build"]
run = "workbench beads claim --output text"

[tasks."beads:close"]
description = "Close a Beads item as this machine's claimant, then sync: `mise run beads:close -- <id> --reason \"<reason>\"`"
depends = ["build"]
run = "workbench beads close --output text"

# ── Workbench's own surface ──────────────────────────────────────────────────

[tasks.build]
description = "Build the workbench CLI into target/debug"
run = "cargo build --quiet"

[tasks.test]
alias = "t"
description = "Run the CLI's tests"
run = "cargo test"

[tasks."docs:build"]
description = "Build the site into docs/public with Hugo, then index it for search with Pagefind"
# A deployed build sets its base URL through HUGO_BASEURL, which Hugo reads in place of
# docs/hugo.toml's `baseURL`; a local build needs nothing set. The build also fails on a dead
# relative link, which makes it the dead-link check inside `mise run check`.
depends = ["link"]
run = ["hugo build --source docs --cleanDestinationDir", "pagefind --site docs/public"]

[tasks."docs:dev"]
description = "Serve the site with live reload; search needs `mise run docs:build`"
depends = ["link"]
run = "hugo server --source docs"

[tasks."cli:reference"]
description = "Regenerate plugin/reference/cli.md from the command registry"
run = "WORKBENCH_UPDATE_REFERENCE=1 cargo test --test reference"

[tasks.package]
description = "Build the release archive for one target into artifacts/: `mise run package -- <target>`"
usage = 'arg "<target>" help="A Rust target triple, such as aarch64-apple-darwin"'
run = """
set -eu
target="${usage_target}"
cargo build --release --locked --target "$target"
root="dist/workbench-$target"
rm -rf "$root" && mkdir -p "$root" artifacts
cp -R plugin/. "$root/"
cp "target/$target/release/workbench" "$root/workbench"
# macOS tar otherwise adds `._*` AppleDouble files for extended attributes.
COPYFILE_DISABLE=1 tar -C dist -czf "artifacts/workbench-$target.tar.gz" "workbench-$target"
"""
