# Adopting projects add their own fmt, lint, test, and build tasks, then wire them into check.

[settings]
experimental = true

[tools]
node = "24"
pnpm = "11"
"npm:oxfmt" = "latest"

[env]
_.path = ['{{config_root}}/node_modules/.bin']

[hooks]
postinstall = "pnpm install"

# Bare `mise run fmt` formats the whole project; trailing paths narrow it to those files,
# which is what the after-edit lifecycle hook uses.
[tasks.fmt]
description = "Format the project, or only the files passed"
run = "oxfmt"

[tasks."fmt:check"]
description = "Check formatting"
run = "oxfmt --check"

[tasks.validate]
description = "Validate the project record"
run = "node tools/validate.mjs"

[tasks.test]
description = "Run the record validator's tests"
run = "node --test tools/*.test.mjs"

[tasks.status]
description = "Show where this project is in the process and what happens next"
run = "node tools/status.mjs"

[tasks.check]
description = "Run project quality gates"
depends = ["fmt:check", "validate", "test", "docs:build"]

[tasks."docs:dev"]
description = "Run the docs site (VitePress) dev server"
run = "vitepress dev docs"

[tasks."docs:build"]
description = "Build the static docs site"
run = "vitepress build docs"

[tasks."docs:preview"]
description = "Preview the built docs site locally"
depends = ["docs:build"]
run = "vitepress preview docs"
